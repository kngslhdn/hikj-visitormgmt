name: One-off admin console exit compatibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Remove visitor exit company dependency'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visitor exit company dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/admin-console-api/index.ts')
          s = p.read_text(encoding='utf-8')
          old_select = "sb.from('visitor_exits').select('submission_id,visitor_name,company_name,exit_at,security_officer_name,pass_vest_number').gte('exit_at',start).limit(5000)"
          new_select = "sb.from('visitor_exits').select('submission_id,visitor_name,exit_at,security_officer_name,pass_vest_number').gte('exit_at',start).limit(5000)"
          old_row = "for(const x of b.data||[])if(!to||x.exit_at<to)rows.push({record_type:'visitor_exit',event_at:x.exit_at,reference:x.submission_id,person_name:x.visitor_name,visitor_name:x.visitor_name,company_name:x.company_name,status:'COMPLETED',security_officer_name:x.security_officer_name});"
          new_row = "for(const x of b.data||[])if(!to||x.exit_at<to)rows.push({record_type:'visitor_exit',event_at:x.exit_at,reference:x.submission_id,person_name:x.visitor_name,visitor_name:x.visitor_name,company_name:null,status:'COMPLETED',security_officer_name:x.security_officer_name});"
          if old_select not in s:
              raise SystemExit('visitor_exits select target not found')
          if old_row not in s:
              raise SystemExit('visitor exit report row target not found')
          s = s.replace(old_select, new_select, 1).replace(old_row, new_row, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/admin-console-api/index.ts
          git commit -m 'Remove visitor exit company dependency'
          git push
          git rm .github/workflows/oneoff-admin-console-exit.yml
          git commit -m 'Remove temporary admin console workflow'
          git push
