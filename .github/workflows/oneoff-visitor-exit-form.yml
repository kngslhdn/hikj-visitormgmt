name: One-off Visitor Exit form update

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  update:
    if: github.event.head_commit.message != 'Update visitor exit form'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Visitor Exit form
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "keluar:{title:'Visitor Exit Registration',description:'Please complete the information before leaving Hotel Indonesia Kempinski Jakarta.',type:'visitor_exit',icon:'exit',fields:[['nama','Name'],['perusahaan','Company / Vendor Name'],['pass','Pass / Vest Number'],['security','Security Officer Name'],['datetime','Exit Date & Time','datetime']]}"
          new = "keluar:{title:'Visitor Exit Registration',description:'Enter the Pass / Vest Number and Security Officer Name. Exit date and time are recorded automatically.',type:'visitor_exit',icon:'exit',fields:[['pass','Pass / Vest Number'],['security','Security Officer Name']]}"
          if old not in s:
              raise SystemExit('Visitor Exit form target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit form update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update visitor exit form'
          git push
      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/oneoff-visitor-exit-form.yml
          git commit -m 'Remove temporary visitor exit workflow'
          git push
