name: One-off rename Key Return Security Officer label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.event.head_commit.message != 'Rename Key Return Security Officer label'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Key Return label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "['security','Security Officer In Charge']"
          new = "['security','Security Officer Name']"
          if old not in s:
              raise SystemExit('Target Key Return label not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/oneoff-rename-key-return.yml
          git add index.html .github/workflows/oneoff-rename-key-return.yml
          git commit -m 'Rename Key Return Security Officer label'
          git push
