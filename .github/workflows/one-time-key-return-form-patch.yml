name: One-time Key Return Form Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[key-return-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Key Return form
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_form = "kembaliKunci:{title:'Key Return',description:'Complete this form after returning keys.',type:'key_return',icon:'return',fields:[['returnName','Return Name'],['department','Department'],['keyNumber','Key Number'],['description','Key Description','textarea'],['qty','Quantity of Keys','number'],['security','Security Officer Name'],['datetime','Date & Time Returned','datetime']]},"
          new_form = "kembaliKunci:{title:'Key Return',description:'Key Number is verified against the outstanding Key Borrowing. Quantity differences are recorded as DISCREPANCY QTY.',type:'key_return',icon:'return',fields:[['returnName','Return Name'],['department','Department'],['keyNumber','Key Number'],['qty','Quantity of Keys','number'],['security','Security Officer Name'],['datetime','Date & Time Returned','datetime']]},"
          if old_form not in s:
              raise SystemExit('Expected Key Return form definition not found')
          s = s.replace(old_form, new_form, 1)
          old_success = "function showSuccess(key,data,result,waWindow){const form=forms[key],id=result?.submission_id||'HIKJ-SUBMISSION';lastSubmission={submissionId:id};const wa=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(formatMessage(form.title,data))}`;if(waWindow&&!waWindow.closed){waWindow.location.href=wa}else{window.open(wa,'_blank','noopener,noreferrer')}resetHome()}"
          new_success = "function showSuccess(key,data,result,waWindow){const form=forms[key],id=result?.submission_id||'HIKJ-SUBMISSION';lastSubmission={submissionId:id};if(key==='kembaliKunci'&&result?.key_return?.discrepancy_qty){window.alert(`⚠️ DISCREPANCY QTY\\nBorrowed: ${result.key_return.borrowed_quantity}\\nReturned: ${result.key_return.returned_quantity}\\nKey Number: ${result.key_return.key_number}`)}const wa=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(formatMessage(form.title,data))}`;if(waWindow&&!waWindow.closed){waWindow.location.href=wa}else{window.open(wa,'_blank','noopener,noreferrer')}resetHome()}"
          if old_success not in s:
              raise SystemExit('Expected showSuccess function not found')
          s = s.replace(old_success, new_success, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Key Return form [key-return-patched]"
          git push