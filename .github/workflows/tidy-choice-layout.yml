name: Tidy Choice Layout

on:
  push:
    paths:
      - '.github/workflows/tidy-choice-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update choice card CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ('.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:34px}',
               '.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:34px}'),
              ('.choice{width:158px;height:189px;min-height:189px;justify-self:center;border:',
               '.choice{width:158px;height:189px;min-height:189px;justify-self:center;border:'),
              ('padding:25px 18px 18px;text-align:center;cursor:pointer;',
               'padding:17px 14px 12px;text-align:center;cursor:pointer;'),
              ('.choice-icon{width:72px;height:72px;margin:0 auto 22px;',
               '.choice-icon{width:58px;height:58px;margin:0 auto 10px;'),
              ('.choice-icon svg{width:38px;height:38px;',
               '.choice-icon svg{width:31px;height:31px;'),
              ('.choice .arrow{display:block;margin-top:27px;color:var(--gold2);font-size:1.6rem;line-height:1}',
               '.choice .arrow{display:block;margin-top:8px;color:var(--gold2);font-size:1.25rem;line-height:1;height:20px}')
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Target CSS not found: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit CSS update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Tidy choice card spacing and arrows'
          git push
