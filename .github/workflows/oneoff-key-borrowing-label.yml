name: One-off Key Borrowing label update

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  rename:
    if: github.event.head_commit.message != 'Rename Key Borrowing Security Officer label'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Key Borrowing label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "['security','Security Officer']"
          new = "['security','Security Officer Name']"
          if old not in s:
              raise SystemExit('Target Key Borrowing label not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename Key Borrowing Security Officer label'
          git push
      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
