<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIKJ Visitor Management | Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a30;--gold:#d9a441;--gold2:#f0c66b;--white:#fff;--line:rgba(185,213,238,.25);--glass:rgba(12,39,67,.72);--danger:#ff9d9d}*{box-sizing:border-box;font-family:Poppins,Arial,sans-serif}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--white);background:radial-gradient(circle at 50% 8%,#163d66 0,#0a2747 34%,#06192e 70%,#031120 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.025),transparent 35%,rgba(217,164,65,.035) 70%,transparent);box-shadow:inset 0 0 180px rgba(0,0,0,.3)}.shell{width:min(1180px,calc(100% - 36px));margin:auto;padding:28px 0 42px}.brand{text-align:center;margin-bottom:18px}.brand-logo{display:block;width:120px;height:auto;max-height:120px;object-fit:contain;margin:0 auto 14px;opacity:.98}.brand-line{width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 17px}.title{text-align:center;margin:0;font-size:28px;font-weight:700;letter-spacing:-1px}.security{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:7px;color:var(--gold2);font-size:.82rem;font-weight:600;letter-spacing:7px}.security:before,.security:after{content:"";height:1px;width:92px;background:linear-gradient(90deg,transparent,var(--gold))}.security:after{background:linear-gradient(90deg,var(--gold),transparent)}.choices{display:grid;grid-template-columns:repeat(6,158px);gap:8px;width:max-content;max-width:100%;margin:34px auto 0}.choice{width:158px;height:189px;min-height:189px;justify-self:center;display:flex;flex-direction:column;align-items:center;border:1px solid rgba(128,174,214,.38);border-radius:18px;background:linear-gradient(145deg,rgba(27,67,106,.62),rgba(6,31,56,.82));color:#fff;padding:17px 14px 12px;text-align:center;cursor:pointer;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;box-shadow:inset 0 1px rgba(255,255,255,.05)}.choice:hover,.choice[aria-pressed="true"]{transform:translateY(-5px);border-color:rgba(240,198,107,.72);box-shadow:0 16px 35px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.08)}.choice-icon{width:58px;height:58px;min-width:58px;flex:0 0 58px;margin:0 auto 10px;border:1px solid rgba(210,228,245,.34);border-radius:50%;display:grid;place-items:center;color:var(--gold2);background:rgba(3,21,38,.5)}.choice-icon svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.choice strong{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;font-size:1rem;line-height:1.35}.choice .arrow{display:flex;align-items:center;justify-content:center;width:100%;height:22px;margin-top:auto;color:var(--gold2);font-size:1.25rem;line-height:1}.panel{display:none;max-width:650px;margin:30px auto 0;overflow:hidden;border-radius:18px;background:var(--glass);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.38);backdrop-filter:blur(12px)}.panel.visible{display:block;animation:panelIn .25s ease}@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.panel-header{padding:23px;border-bottom:1px solid var(--line)}.panel-header h2{margin:0;font-size:1.3rem}.panel-header p{margin:6px 0 0;opacity:.75;font-size:.82rem}form{padding:23px}.field{margin-bottom:18px}label{display:block;margin-bottom:6px;font-size:.82rem;font-weight:500}input,select,textarea{width:100%;border:0;border-bottom:2px solid var(--line);outline:0;padding:11px 5px;background:transparent;color:#fff;font-size:.92rem}select option{color:#111}textarea{min-height:88px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--gold2)}input[readonly]{opacity:.78}input[type=file]{border:1px dashed var(--line);border-radius:10px;padding:10px}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#d49a2c,#efc363);color:#071a30;font-weight:700;font-size:.92rem;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.notice{padding:0 23px 20px;color:#c7f9d8;font-size:.8rem;min-height:24px;line-height:1.5}.notice.error{color:var(--danger)}.success{padding:27px 23px 23px}.success h3{margin:0 0 8px;font-size:1.15rem}.success p{margin:5px 0;opacity:.82;font-size:.84rem}.success-id{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:600;letter-spacing:.03em}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}.action{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:700;font-size:.84rem;cursor:pointer;border:1px solid var(--line)}.action.whatsapp{background:#25d366;color:#fff;border-color:transparent}.action.home{background:transparent;color:#fff}.footer{margin:48px auto 0;text-align:center;color:rgba(255,255,255,.62);font-size:.68rem;letter-spacing:5px}.footer:before,.footer:after{content:"";display:inline-block;width:85px;height:1px;background:rgba(255,255,255,.28);vertical-align:middle;margin:0 18px}.privacy{margin:17px auto 0;text-align:center;color:rgba(255,255,255,.38);font-size:.65rem}@media(max-width:900px){.choices{grid-template-columns:repeat(3,158px);width:490px;max-width:100%;justify-content:center}.choice:last-child{grid-column:auto;max-width:none;width:158px;justify-self:center}}@media(max-width:520px){.shell{width:min(100% - 20px,1180px);padding-top:22px}.brand-logo{width:92px;max-height:92px}.title{font-size:24px;line-height:1.2}.security{letter-spacing:5px}.security:before,.security:after{width:45px}.choices{grid-template-columns:1fr;gap:11px;width:100%;margin-top:27px}.choice,.choice:last-child{width:100%;height:116px;min-height:116px;max-width:none;grid-column:auto;justify-self:stretch;flex-direction:row;align-items:center;justify-content:flex-start;padding:14px 18px;border-radius:18px;text-align:left}.choice-icon{width:58px;height:58px;min-width:58px;flex:0 0 58px;margin:0 17px 0 0}.choice strong{width:auto;min-height:0;flex:1;justify-content:flex-start;font-size:.98rem;line-height:1.3}.choice .arrow{width:auto;height:auto;margin:0 0 0 12px;font-size:1.25rem}.footer{letter-spacing:3px}.footer:before,.footer:after{width:35px;margin:0 9px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
