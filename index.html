<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIKJ Visitor Management | Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#071a30;--gold:#d9a441;--gold2:#f0c66b;--white:#fff;--line:rgba(185,213,238,.25);--glass:rgba(12,39,67,.72);--danger:#ff9d9d}*{box-sizing:border-box;font-family:Poppins,Arial,sans-serif}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--white);background:radial-gradient(circle at 50% 8%,#163d66 0,#0a2747 34%,#06192e 70%,#031120 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.025),transparent 35%,rgba(217,164,65,.035) 70%,transparent);box-shadow:inset 0 0 180px rgba(0,0,0,.3)}.shell{width:min(1180px,calc(100% - 36px));margin:auto;padding:28px 0 42px}.brand{text-align:center;margin-bottom:18px}.brand-logo{display:block;width:120px;height:auto;max-height:120px;object-fit:contain;margin:0 auto 14px;opacity:.98}.brand-line{width:70px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 17px}.title{text-align:center;margin:0;font-size:28px;font-weight:700;letter-spacing:-1px}.security{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:7px;color:var(--gold2);font-size:.82rem;font-weight:600;letter-spacing:7px}.security:before,.security:after{content:"";height:1px;width:92px;background:linear-gradient(90deg,transparent,var(--gold))}.security:after{background:linear-gradient(90deg,var(--gold),transparent)}.choices{display:grid;grid-template-columns:repeat(6,158px);gap:8px;width:max-content;max-width:100%;margin:34px auto 0}.choice{width:158px;height:189px;min-height:189px;justify-self:center;display:flex;flex-direction:column;align-items:center;border:1px solid rgba(128,174,214,.38);border-radius:18px;background:linear-gradient(145deg,rgba(27,67,106,.62),rgba(6,31,56,.82));color:#fff;padding:17px 14px 12px;text-align:center;cursor:pointer;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;box-shadow:inset 0 1px rgba(255,255,255,.05)}.choice:hover,.choice[aria-pressed="true"]{transform:translateY(-5px);border-color:rgba(240,198,107,.72);box-shadow:0 16px 35px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.08)}.choice-icon{width:58px;height:58px;min-width:58px;flex:0 0 58px;margin:0 auto 10px;border:1px solid rgba(210,228,245,.34);border-radius:50%;display:grid;place-items:center;color:var(--gold2);background:rgba(3,21,38,.5)}.choice-icon svg{width:31px;height:31px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.choice strong{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;font-size:1rem;line-height:1.35}.choice .arrow{display:flex;align-items:center;justify-content:center;width:100%;height:22px;margin-top:auto;color:var(--gold2);font-size:1.25rem;line-height:1}.panel{display:none;max-width:650px;margin:30px auto 0;overflow:hidden;border-radius:18px;background:var(--glass);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.38);backdrop-filter:blur(12px)}.panel.visible{display:block;animation:panelIn .25s ease}@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.panel-header{padding:23px;border-bottom:1px solid var(--line)}.panel-header h2{margin:0;font-size:1.3rem}.panel-header p{margin:6px 0 0;opacity:.75;font-size:.82rem}form{padding:23px}.field{margin-bottom:18px}label{display:block;margin-bottom:6px;font-size:.82rem;font-weight:500}input,select,textarea{width:100%;border:0;border-bottom:2px solid var(--line);outline:0;padding:11px 5px;background:transparent;color:#fff;font-size:.92rem}select option{color:#111}textarea{min-height:88px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--gold2)}input[readonly]{opacity:.78}input[type=file]{border:1px dashed var(--line);border-radius:10px;padding:10px}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#d49a2c,#efc363);color:#071a30;font-weight:700;font-size:.92rem;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.notice{padding:0 23px 20px;color:#c7f9d8;font-size:.8rem;min-height:24px;line-height:1.5}.notice.error{color:var(--danger)}.success{padding:27px 23px 23px}.success h3{margin:0 0 8px;font-size:1.15rem}.success p{margin:5px 0;opacity:.82;font-size:.84rem}.success-id{margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:center;font-weight:600;letter-spacing:.03em}.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}.action{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:12px 14px;border-radius:12px;text-decoration:none;font-weight:700;font-size:.84rem;cursor:pointer;border:1px solid var(--line)}.action.whatsapp{background:#25d366;color:#fff;border-color:transparent}.action.home{background:transparent;color:#fff}.footer{margin:48px auto 0;text-align:center;color:rgba(255,255,255,.62);font-size:.68rem;letter-spacing:5px}.footer:before,.footer:after{content:"";display:inline-block;width:85px;height:1px;background:rgba(255,255,255,.28);vertical-align:middle;margin:0 18px}.privacy{margin:17px auto 0;text-align:center;color:rgba(255,255,255,.38);font-size:.65rem}@media(max-width:900px){.choices{grid-template-columns:repeat(3,158px);width:490px;max-width:100%;justify-content:center}.choice:last-child{grid-column:auto;max-width:none;width:158px;justify-self:center}}@media(max-width:520px){.shell{width:min(100% - 20px,1180px);padding-top:22px}.brand-logo{width:92px;max-height:92px}.title{font-size:24px;line-height:1.2}.choices{grid-template-columns:1fr;gap:11px;width:100%;margin-top:27px}.choice,.choice:last-child{width:100%;height:116px;min-height:116px;max-width:none;grid-column:auto;justify-self:stretch;flex-direction:row;align-items:center;justify-content:flex-start;padding:14px 18px;border-radius:18px;text-align:left}.choice-icon{width:58px;height:58px;min-width:58px;flex:0 0 58px;margin:0 17px 0 0}.choice strong{width:auto;min-height:0;flex:1;justify-content:flex-start;font-size:.98rem;line-height:1.3}.choice .arrow{width:auto;height:auto;margin:0 0 0 12px;font-size:1.25rem}.security{letter-spacing:5px}.security:before,.security:after{width:45px}.footer{letter-spacing:3px}.footer:before,.footer:after{width:35px;margin:0 9px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
<header class="brand">
  <img class="brand-logo" src="assets/hikj-logo.svg" alt="Hotel Indonesia Kempinski Jakarta">
  <div class="brand-line"></div>
  <h1 class="title">HIKJ Visitor Management</h1>
  <div class="security"><span>SECURITY</span></div>
</header>
<section id="choices" class="choices" aria-label="Security services"></section>
<section id="panel" class="panel" aria-live="polite"></section>
<div class="footer">SECURE&nbsp;&nbsp;•&nbsp;&nbsp;SAFE&nbsp;&nbsp;•&nbsp;&nbsp;WELCOMING</div>
<p class="privacy">HIKJ Security Operations</p>
</main>
<script>
const SUPABASE_FUNCTION_URL='https://hmqgmusellcetakoalva.supabase.co/functions/v1/visitor-submit';
const WA_NUMBER='6281314414955';
const locations=['Receiving','Purchasing','Grand Ball Room','Bali Room','Ramayana Terrace','Heritage 1','Heritage 2','Cendana + Eboni','Palapi + Jati','Damar + Angsana','Mahoni + Ulin','Business Center','Signature Restaurant','Paulaner Restaurant','Oku Restaurant','Executive Lounge','President Suite Room 832','Room','Other'];
const icons={entry:'<svg viewBox="0 0 48 48"><circle cx="24" cy="14" r="7"/><path d="M11 38c1.5-8 6.2-12 13-12s11.5 4 13 12"/></svg>',exit:'<svg viewBox="0 0 48 48"><path d="M28 9H13v30h15"/><path d="M22 24h17M32 17l7 7-7 7"/></svg>',key:'<svg viewBox="0 0 48 48"><circle cx="16" cy="31" r="8"/><path d="M22 25 37 10M31 16l5 5M27 20l5 5"/></svg>',return:'<svg viewBox="0 0 48 48"><circle cx="16" cy="18" r="6.5"/><path d="M21 23 36 8M29 15l5 5M25 19l5 5"/><path d="M8 30c1 7 7 11 14 11 8 0 14-5 16-12"/><path d="M38 29l-1 6-6-1"/></svg>',package:'<svg viewBox="0 0 48 48"><path d="M9 15l15-7 15 7-15 7zM9 15v18l15 8 15-8V15M24 22v19M16 11l15 7"/></svg>'};
const forms={
masuk:{title:'Visitor Entry Registration',description:'Please complete the information before entering Hotel Indonesia Kempinski Jakarta.',type:'visitor_entry',icon:'entry',fields:[['nama','Name'],['phone','Mobile Phone Number','tel'],['perusahaan','Company / Vendor Name'],['kategori','Category','select',['Contractor','Supplier','Visitor','Part-time']],['lokasi','Work Location','select',locations],['tujuan','Purpose','textarea'],['security','Security Officer Name'],['pass','Pass / Vest Number'],['datetime','Entry Date & Time','datetime']]},
keluar:{title:'Visitor Exit Registration',description:'Please complete the information before leaving Hotel Indonesia Kempinski Jakarta.',type:'visitor_exit',icon:'exit',fields:[['nama','Name'],['perusahaan','Company / Vendor Name'],['pass','Pass / Vest Number'],['security','Security Officer Name'],['datetime','Exit Date & Time','datetime']]},
pinjamKunci:{title:'Key Borrowing',description:'Complete this form before borrowing keys.',type:'key_borrowing',icon:'key',fields:[['borrowerName','Borrower Name'],['department','Department'],['keyNumber','Key Number'],['description','Key Description','textarea'],['qty','Quantity of Keys','number'],['security','Security Officer'],['datetime','Date & Time Borrowed','datetime']]},
kembaliKunci:{title:'Key Return',description:'Complete this form after returning keys.',type:'key_return',icon:'return',fields:[['returnName','Return Name'],['department','Department'],['keyNumber','Key Number'],['description','Key Description','textarea'],['qty','Quantity of Keys','number'],['security','Security Officer Name'],['datetime','Date & Time Returned','datetime']]},
paket:{title:'Package Registration',description:'Record the package delivery and item photo.',type:'package_registration',icon:'package',upload:true,fields:[['namaPengantar','Courier Name'],['telepon','Phone Number','tel'],['perusahaan','Company Name'],['jenisBarang','Item Type','select',['LETTER','PACKAGE']],['jumlah','Number of Items','number'],['tujuan','Purpose','select',['STAFF','GUEST']],['namaTujuan','Recipient Name'],['security','Security Officer Name'],['foto','Item Photo','file']]}};
const choiceRoot=document.querySelector('#choices'),panel=document.querySelector('#panel');
let lastSubmission=null;
const dateText=()=>{const n=new Date();return n.toLocaleDateString('en-GB')+' '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
const escapeHtml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
function inputMarkup([name,label,type='text',options=[]]){if(type==='textarea')return `<div class="field"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" required></textarea></div>`;if(type==='select')return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}" required><option value="">Select</option>${options.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('')}</select></div>`;if(type==='datetime')return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" readonly value="${dateText()}"></div>`;if(type==='file')return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="file" accept="image/jpeg,image/png,image/webp" required></div>`;return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" min="1" required></div>`}
Object.entries(forms).forEach(([key,form])=>choiceRoot.insertAdjacentHTML('beforeend',`<button type="button" class="choice" data-form="${key}" aria-pressed="false"><span class="choice-icon">${icons[form.icon]}</span><strong>${form.title}</strong><span class="arrow">→</span></button>`));
choiceRoot.addEventListener('click',e=>{const b=e.target.closest('[data-form]');if(b)showForm(b.dataset.form)});
function formatMessage(title,data){const lines=['HIKJ VISITOR MANAGEMENT','',`NEW ${title.toUpperCase()}`,''];for(const [key,value] of data.entries()){if(key==='foto')continue;const field=document.querySelector(`[name="${CSS.escape(key)}"]`);lines.push(`${field?.closest('.field')?.querySelector('label')?.textContent||key}: ${value}`)}if(lastSubmission?.submissionId)lines.push('',`Submission ID: ${lastSubmission.submissionId}`);return lines.join('\n')}
async function readFile(file){if(!file)return '';return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function submitToSupabase(form,data){const payload=Object.fromEntries(data.entries());payload.type=form.type;payload.submission_source='public-web';payload.idempotency_key=crypto.randomUUID();if(form.upload){const file=data.get('foto');payload.foto=await readFile(file)}const r=await fetch(SUPABASE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','idempotency-key':payload.idempotency_key},body:JSON.stringify(payload)});let result=null;try{result=await r.json()}catch{}if(!r.ok||!result?.ok)throw Error(result?.error||`HTTP ${r.status}`);return result}
function resetHome(){panel.classList.remove('visible');panel.innerHTML='';document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed','false'));window.scrollTo({top:0,behavior:'smooth'})}
function showSuccess(key,data,result,waWindow){const form=forms[key],id=result?.submission_id||'HIKJ-SUBMISSION';lastSubmission={submissionId:id};const wa=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(formatMessage(form.title,data))}`;if(waWindow&&!waWindow.closed){waWindow.location.href=wa}else{window.open(wa,'_blank','noopener,noreferrer')}resetHome()}
function showForm(key){const form=forms[key];document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.form===key)));panel.innerHTML=`<div class="panel-header"><h2>${form.title}</h2><p>${form.description}</p></div><form id="activeForm" novalidate>${form.fields.map(inputMarkup).join('')}<button class="submit" type="submit">SUBMIT</button></form><div class="notice" id="notice"></div>`;panel.classList.add('visible');panel.scrollIntoView({behavior:'smooth',block:'start'});panel.querySelector('form').addEventListener('submit',e=>submitForm(e,key))}
async function submitForm(e,key){e.preventDefault();const form=forms[key],el=e.currentTarget,notice=panel.querySelector('#notice');if(!el.reportValidity())return;const btn=el.querySelector('.submit');btn.disabled=true;notice.textContent='Submitting…';notice.classList.remove('error');const data=new FormData(el);let waWindow=null;try{waWindow=window.open('about:blank','_blank');const result=await submitToSupabase(form,data);showSuccess(key,data,result,waWindow)}catch(err){if(waWindow&&!waWindow.closed)waWindow.close();const message=err?.message||'The form could not be submitted. Please try again.';notice.textContent=message;notice.classList.add('error');btn.disabled=false;if(key==='keluar'&&/Visitor not found/i.test(message)){window.alert('⚠️ WARNING\n\nNama atau Pass / Vest Number tidak ditemukan pada visitor yang masih berada di dalam hotel.\n\nSilakan periksa kembali data Exit Registration.');}else{window.alert(`⚠️ WARNING\n\n${message}`);}}}
</script>
<script>window.HIKJ_SUPABASE_PUBLISHABLE_KEY='sb_publishable_J6P-baCAZOoVxj2rHBZMkA_Ux4U5_mQ';</script>
<script src="assets/package-distribution.js"></script>
</body>
</html>
