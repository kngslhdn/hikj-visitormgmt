function generateUUID(){
  if(typeof crypto?.randomUUID==='function')return crypto.randomUUID();
  if(typeof crypto?.getRandomValues==='function'){
    const bytes=new Uint8Array(16);
    crypto.getRandomValues(bytes);
    bytes[6]=(bytes[6]&0x0f)|0x40;
    bytes[8]=(bytes[8]&0x3f)|0x80;

async function readFile(file){if(!file)return '';return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function submitToSupabase(form,data){const payload=Object.fromEntries(data.entries());payload.type=form.type;payload.submission_source='public-web';payload.idempotency_key=generateUUID();if(form.upload){const file=data.get('foto');payload.foto=await readFile(file)}const r=await fetch(SUPABASE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','idempotency-key':payload.idempotency_key},body:JSON.stringify(payload)});let result=null;try{result=await r.json()}catch{}if(!r.ok||!result?.ok)throw Error(result?.error||`HTTP ${r.status}`);return result}
function resetHome(){panel.classList.remove('visible');panel.innerHTML='';document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed','false'));window.scrollTo({top:0,behavior:'smooth'})}
function showSuccess(key,data,result,waWindow){const form=forms[key],id=result?.submission_id||'HIKJ-SUBMISSION';lastSubmission={submissionId:id};if(key==='kembaliKunci'&&result?.key_return?.discrepancy){window.alert(`⚠️ DISCREPANCY QTY\nBorrowed: ${result.key_return.original_borrowed_quantity}\nReturned: ${result.key_return.total_returned}\nKey Number: ${result.key_return.key_number}`)}const waNumber=String(result?.whatsapp_number||WA_NUMBER);const wa=`https://wa.me/${waNumber}?text=${encodeURIComponent(formatMessage(form.title,data))}`;if(waWindow&&!waWindow.closed){waWindow.location.href=wa}else{window.open(wa,'_blank','noopener,noreferrer')}resetHome()}
async function lookupKeyAsset(keyNumber,form,notice){
 const key=String(keyNumber||'').trim();
 const description=document.querySelector('#description');
 const qty=document.querySelector('#qty');
 if(description)description.value='';
 if(qty)qty.value='';
 if(form)form.dataset.keyAssetValid='false';
 if(!key){if(notice)notice.textContent=DEVICE_LANG==='id'?'Masukkan Nomor Kunci untuk memuat Deskripsi Kunci dan Jumlah':'Enter a Key Number to load Key Description and Quantity';return}
 if(notice){notice.textContent=DEVICE_LANG==='id'?'Memeriksa aset kunci…':'Checking Key Asset…';notice.classList.remove('error')}
 const requestId=++keyAssetLookupSeq;
 try{
  const r=await fetch(SUPABASE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'key_asset_lookup',key_number:key})});
  let result=null;try{result=await r.json()}catch{}
  if(requestId!==keyAssetLookupSeq)return;
  if(!r.ok||!result?.ok)throw Error(result?.error||DEVICE_LANG==='id'?'Nomor Kunci tidak dapat diverifikasi':'Key Number could not be verified');
  const asset=result.key_asset||{};
  if(description)description.value=asset.description||'';
  if(qty)qty.value=asset.quantity??'';
  if(form)form.dataset.keyAssetValid='true';
  if(notice){notice.textContent=DEVICE_LANG==='id'?'Aset kunci terverifikasi. Deskripsi dan jumlah dimuat dari Key Assets':'Key Asset verified. Description and Quantity are loaded from Key Assets';notice.classList.remove('error')}
 }catch(err){
  if(requestId!==keyAssetLookupSeq)return;
  if(form)form.dataset.keyAssetValid='false';
  if(notice){notice.textContent=err?.message||'Unable to verify Key Number';notice.classList.add('error')}
 }
}
function wireKeyBorrowingLookup(form){
 const keyInput=document.querySelector('#keyNumber');
 const description=document.querySelector('#description');
 const qty=document.querySelector('#qty');
 const notice=document.querySelector('#notice');
 if(!keyInput||!form)return;
 if(description){description.readOnly=true;description.setAttribute('aria-readonly','true')}
 if(qty){qty.readOnly=true;qty.setAttribute('aria-readonly','true')}
 form.dataset.keyAssetValid='false';
 keyInput.addEventListener('input',()=>{
  clearTimeout(keyAssetLookupTimer);
  ++keyAssetLookupSeq;
  form.dataset.keyAssetValid='false';
  if(description)description.value='';
  if(qty)qty.value='';
  if(notice){notice.textContent='';notice.classList.remove('error')}
  const value=keyInput.value.trim();
  if(!value)return;
  keyAssetLookupTimer=setTimeout(()=>lookupKeyAsset(value,form,notice),350);
 });
 keyInput.addEventListener('blur',()=>{
  clearTimeout(keyAssetLookupTimer);
  const value=keyInput.value.trim();
  if(value)lookupKeyAsset(value,form,notice);
 });
}
function showForm(key){const form=forms[key];document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.form===key)));panel.innerHTML=`<div class="panel-header"><h2>${form.title}</h2><p>${form.description}</p></div><form id="activeForm" novalidate>${form.fields.map(inputMarkup).join('')}<button class="submit" type="submit">${L.submit}</button></form><div class="notice" id="notice"></div>`;panel.classList.add('visible');panel.scrollIntoView({behavior:'smooth',block:'start'});const activeForm=panel.querySelector('form');activeForm.addEventListener('submit',e=>submitForm(e,key));if(key==='pinjamKunci')wireKeyBorrowingLookup(activeForm)}
async function submitForm(e,key){e.preventDefault();const form=forms[key],el=e.currentTarget,notice=panel.querySelector('#notice');if(!el.reportValidity())return;if(key==='pinjamKunci'&&el.dataset.keyAssetValid!=='true'){notice.textContent=DEVICE_LANG==='id'?'Masukkan Nomor Kunci aktif yang valid dan tunggu Deskripsi Kunci serta Jumlah dimuat':'Please enter a valid active Key Number and wait for Key Description and Quantity to load';notice.classList.add('error');return;}const btn=el.querySelector('.submit');btn.disabled=true;notice.textContent=DEVICE_LANG==='id'?'Mengirim…':'Submitting…';notice.classList.remove('error');const data=new FormData(el);
if(key==='kembaliKunci'){
  const confirmed=window.confirm(
    (DEVICE_LANG==='id'?'KONFIRMASI PENGEMBALIAN KUNCI\n\n':'CONFIRM KEY RETURN\n\n')+
    'Key Number: '+(data.get('keyNumber')||'—')+'\n'+
    (DEVICE_LANG==='id'?'Dikembalikan Oleh: ':'Returned By: ')+(data.get('returnName')||'—')+'\n'+
    (DEVICE_LANG==='id'?'Departemen: ':'Department: ')+(data.get('department')||'—')+'\n'+
    (DEVICE_LANG==='id'?'Jumlah Dikembalikan: ':'Quantity Returning: ')+(data.get('qty')||'—')+'\n'+
    (DEVICE_LANG==='id'?'Diterima Oleh Petugas Keamanan: ':'Received By Security: ')+(data.get('security')||'—')+'\n\n'+
    (DEVICE_LANG==='id'?'Mohon periksa jumlah kunci sebelum melakukan konfirmasi':'Please verify the quantity before confirming')
  );
  if(!confirmed){btn.disabled=false;notice.textContent=DEVICE_LANG==='id'?'Pengembalian dibatalkan':'Return cancelled';return}
}
let waWindow=null;try{waWindow=window.open('about:blank','_blank');const result=await submitToSupabase(form,data);showSuccess(key,data,result,waWindow)}catch(err){if(waWindow&&!waWindow.closed)waWindow.close();const message=err?.message||'The form could not be submitted. Please try again';notice.textContent=message;notice.classList.add('error');btn.disabled=false;if(key==='keluar'&&/Visitor not found/i.test(message)){window.alert('⚠️ WARNING\n\nNama atau Pass / Vest Number tidak ditemukan pada visitor yang masih berada di dalam hotel\n\nSilakan periksa kembali data Exit Registration');}else{window.alert(`⚠️ WARNING\n\n${message}`);}}}
</script>
