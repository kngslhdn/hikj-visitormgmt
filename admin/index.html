<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIKJ Visitor Management | Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font:14px Arial;background:#071a30;color:#111}.box{width:min(430px,calc(100% - 40px));margin:8vh auto;background:#fff;padding:32px;border-radius:20px;box-shadow:0 20px 60px #0008}img{display:block;width:110px;height:75px;object-fit:contain;margin:auto}.brand{text-align:center;color:#071a30;font-size:20px;font-weight:700}.brand small{display:block;color:#64748b;font-size:11px;font-weight:400;margin-top:5px;letter-spacing:1px}h1{font-size:22px;margin:28px 0 6px}p{color:#64748b;font-size:12px}.field{margin:15px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;box-sizing:border-box}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#071a30;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:12px;padding:12px;border-radius:9px;background:#f8fafc;color:#334155;white-space:pre-wrap;word-break:break-word;font-size:12px}.ok{background:#ecfdf5;color:#166534}.bad{background:#fef2f2;color:#991b1b}.hidden{display:none}.panel{width:min(900px,calc(100% - 40px));margin:30px auto;background:#fff;border-radius:16px;padding:25px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border:1px solid #e5e7eb;border-radius:12px}.stat b{font-size:24px}.logout{width:auto;float:right;background:#fff;color:#071a30;border:1px solid #ddd}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div id="login" class="box"><img src="https://upload.wikimedia.org/wikipedia/commons/6/60/Hotel_Indonesia_Kempinski_Jakarta_logo.svg"><div class="brand">HIKJ Visitor Management<small>SECURITY ADMINISTRATION CONSOLE</small></div><h1>Admin Sign In</h1><p>Authorized HIKJ Security administrators only.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="btn" class="btn" type="submit">SIGN IN</button><div id="msg" class="msg hidden"></div></form></div><div id="app" class="panel hidden"><button id="logout" class="btn logout">SIGN OUT</button><h1>Admin Authentication OK</h1><p id="who"></p><div class="stats"><div class="stat"><small>Total Visitors</small><br><b id="v">—</b></div><div class="stat"><small>Today Entry</small><br><b id="e">—</b></div><div class="stat"><small>Today Exit</small><br><b id="x">—</b></div><div class="stat"><small>Currently Inside</small><br><b id="i">—</b></div></div><div id="apiMsg" class="msg"></div></div><script>
const SUPABASE_URL='https://hmqgmusellcetakoalva.supabase.co',SUPABASE_KEY='sb_publishable_J6P-baCAZOoVxj2rHBZMkA_Ux4U5_mQ',ADMIN_API=SUPABASE_URL+'/functions/v1/admin-api',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
function show(text,ok=false){$('msg').textContent=text;$('msg').className='msg '+(ok?'ok':'bad')}
async function api(action){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('No active session');const r=await fetch(ADMIN_API+'?action='+encodeURIComponent(action),{headers:{Authorization:'Bearer '+session.access_token}});let b={};try{b=await r.json()}catch{}if(!r.ok)throw Error('Admin API HTTP '+r.status+': '+(b.error||'Unknown error'));return b}
async function start(){try{const {data:{session}}=await sb.auth.getSession();if(!session)return;const r=await api('summary');$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Signed in as '+(session.user.email||session.user.id);$('v').textContent=r.summary.total_visitors;$('e').textContent=r.summary.today_entry;$('x').textContent=r.summary.today_exit;$('i').textContent=r.summary.currently_inside;$('apiMsg').className='msg ok';$('apiMsg').textContent='Authentication and Admin API authorization are working.'}catch(err){await sb.auth.signOut();show('Admin authorization failed:\n'+(err.message||err))}}
$('form').addEventListener('submit',async ev=>{ev.preventDefault();const b=$('btn');b.disabled=true;b.textContent='SIGNING IN…';show('Connecting to Supabase Auth…',true);try{if(!window.supabase)throw Error('Supabase JS library did not load.');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;if(!data.session)throw Error('Supabase returned no session.');show('Password accepted. Checking Admin Profile…',true);await start()}catch(err){console.error('HIKJ LOGIN ERROR',err);show('LOGIN FAILED\n'+(err.name?err.name+': ':'')+(err.message||String(err)))}finally{b.disabled=false;b.textContent='SIGN IN'}});
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};start();
</script></body></html>
